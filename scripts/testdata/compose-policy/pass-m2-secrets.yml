# Fixture for scripts/test-check-compose-policy.sh: must PASS.
# The real M2 mapping: ingest -> {mkk_credentials, openai_api_key}, seller-api ->
# {openai_api_key}, orchestrator -> {x402_buyer_private_key, openai_api_key}, all secrets file-sourced.
name: cptest-pass-m2-secrets
services:
  orchestrator:
    image: busybox:1
    secrets: [x402_buyer_private_key]
  seller-api:
    image: busybox:1
    secrets: [openai_api_key]
  ingest:
    image: busybox:1
    secrets: [mkk_credentials, openai_api_key]
secrets:
  x402_buyer_private_key:
    file: ../../secrets/x402_buyer_private_key
  mkk_credentials:
    file: ../../secrets/mkk_credentials
  openai_api_key:
    file: ../../secrets/openai_api_key
