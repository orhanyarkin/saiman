# Fixture for scripts/test-check-compose-policy.sh: must PASS.
# The ADR-0009-sanctioned M3 shape: the orchestrator mounts the buyer key (long syntax with
# a configtree target) and the OpenAI key as file secrets, pins plaintext x402 to seller-api,
# and holds no key-looking environment entry; seller-api has only the public payTo.
name: cptest-pass-orchestrator-secrets
services:
  orchestrator:
    image: busybox:1
    secrets:
      - source: x402_buyer_private_key
        target: x402.client.private-key
      - openai_api_key
    environment:
      X402_CLIENT_ALLOWED_PLAINTEXT_HOSTS: seller-api
      X402_CLIENT_ALLOWED_PAY_TO: "0x1234567890123456789012345678901234567890"
  seller-api:
    image: busybox:1
    environment:
      X402_SELLER_PAYTO_ADDRESS: "0x1234567890123456789012345678901234567890"
secrets:
  x402_buyer_private_key:
    file: ../../secrets/x402_buyer_private_key
  openai_api_key:
    file: ../../secrets/openai_api_key
