# Fixture for scripts/test-check-compose-policy.sh: must PASS.
# The ADR-0009-sanctioned shape: only orchestrator mounts a secret, no service has an
# env_file, a config sourced from a key, a keyish bind mount, or a keyish environment
# entry (including orchestrator itself, which holds no plain-env key here — only the
# secrets: mount).
name: cptest-pass-orchestrator-secrets
services:
  orchestrator:
    image: busybox:1
    secrets: [buyer_key]
  seller-api:
    image: busybox:1
    environment:
      X402_SELLER_PAYTO_ADDRESS: "0x1234567890123456789012345678901234567890"
secrets:
  buyer_key:
    environment: X402_BUYER_PRIVATE_KEY
