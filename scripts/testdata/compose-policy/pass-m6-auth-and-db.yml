# Fixture for scripts/test-check-compose-policy.sh: must PASS.
# M6 shape (ADR-0023/0024/0025): per-service DB users and file secrets, db-init holds all eight, digests only, evals writes only build/evals.
name: cptest-m6
services:
  db-init:
    image: busybox:1
    environment:
      PGPASSWORD: saiman
    secrets:
      - pg_orchestrator_owner_password
      - pg_orchestrator_app_password
      - pg_seller_api_owner_password
      - pg_seller_api_app_password
      - pg_ledger_owner_password
      - pg_ledger_app_password
      - pg_ingest_owner_password
      - pg_ingest_app_password
  orchestrator:
    image: busybox:1
    profiles: ["apps"]
    pull_policy: never
    secrets:
      - source: pg_orchestrator_owner_password
        target: spring.flyway.password
      - source: pg_orchestrator_app_password
        target: spring.datasource.password
    environment:
      SPRING_DATASOURCE_USERNAME: orchestrator_app
      SPRING_FLYWAY_USER: orchestrator_owner
      SAIMAN_AUTH_READER_TOKEN_SHA256: ${SAIMAN_AUTH_READER_TOKEN_SHA256:-}
      SAIMAN_AUTH_OPERATOR_TOKEN_SHA256: ${SAIMAN_AUTH_OPERATOR_TOKEN_SHA256:-}
  seller-api:
    image: busybox:1
    profiles: ["apps"]
    pull_policy: never
    secrets:
      - source: pg_seller_api_owner_password
        target: spring.flyway.password
      - source: pg_seller_api_app_password
        target: spring.datasource.password
    environment:
      SPRING_DATASOURCE_USERNAME: seller_api_app
      SPRING_FLYWAY_USER: seller_api_owner
      SAIMAN_AUTH_SERVICE_TOKENS_LEDGER_SHA256: ${SAIMAN_AUTH_SERVICE_TOKENS_LEDGER_SHA256:-}
      SAIMAN_AUTH_SERVICE_TOKENS_EVALS_SHA256: ${SAIMAN_AUTH_SERVICE_TOKENS_EVALS_SHA256:-}
  ledger:
    image: busybox:1
    profiles: ["apps"]
    pull_policy: never
    secrets:
      - source: pg_ledger_owner_password
        target: spring.flyway.password
      - source: pg_ledger_app_password
        target: spring.datasource.password
      - source: seller_service_token_ledger
        target: saiman.ledger.seller.service-token
    environment:
      SPRING_DATASOURCE_USERNAME: ledger_app
      SPRING_FLYWAY_USER: ledger_owner
      SAIMAN_AUTH_READER_TOKEN_SHA256: ${SAIMAN_AUTH_READER_TOKEN_SHA256:-}
      SAIMAN_AUTH_OPERATOR_TOKEN_SHA256: ${SAIMAN_AUTH_OPERATOR_TOKEN_SHA256:-}
  ingest:
    image: busybox:1
    profiles: ["apps"]
    pull_policy: never
    secrets:
      - source: pg_ingest_owner_password
        target: spring.flyway.password
      - source: pg_ingest_app_password
        target: spring.datasource.password
    environment:
      SPRING_DATASOURCE_USERNAME: ingest_app
      SPRING_FLYWAY_USER: ingest_owner
  evals:
    image: busybox:1
    profiles: ["evals"]
    pull_policy: never
    secrets:
      - source: seller_service_token_evals
        target: saiman.evals.seller.service-token
    volumes:
      - ../../build/evals:/out
secrets:
  pg_orchestrator_owner_password:
    file: ../../secrets/pg_orchestrator_owner_password
  pg_orchestrator_app_password:
    file: ../../secrets/pg_orchestrator_app_password
  pg_seller_api_owner_password:
    file: ../../secrets/pg_seller_api_owner_password
  pg_seller_api_app_password:
    file: ../../secrets/pg_seller_api_app_password
  pg_ledger_owner_password:
    file: ../../secrets/pg_ledger_owner_password
  pg_ledger_app_password:
    file: ../../secrets/pg_ledger_app_password
  pg_ingest_owner_password:
    file: ../../secrets/pg_ingest_owner_password
  pg_ingest_app_password:
    file: ../../secrets/pg_ingest_app_password
  seller_service_token_ledger:
    file: ../../secrets/seller_service_token_ledger
  seller_service_token_evals:
    file: ../../secrets/seller_service_token_evals
