# Default routes (ADR-0003, ADR-0011). Override any key with saiman.router.* properties.
# Model ids are plausible OpenAI API ids and UNVERIFIED: the docs/ARCHITECTURE.md names are display
# names. The live smoke test fixes them.
# Reasoning models spend completion tokens on hidden reasoning, so the limits leave room for it.
saiman:
  router:
    daily-cap-usd-micros: 700000 # $0.70 per UTC day
    openai:
      max-retries: 1 # counted in the worst-case cost estimate of every call
      timeout: 30s
    routes:
      tier0:
        provider: openai
        model: gpt-5-nano
        max-completion-tokens: 2000
        reasoning-effort: minimal
        allowed-data-classes: [public, internal]
        region: us
      tier1:
        provider: openai
        model: gpt-5-mini
        max-completion-tokens: 3000
        reasoning-effort: low
        allowed-data-classes: [public, internal]
        region: us
      tier1-premium:
        provider: openai
        model: gpt-5
        max-completion-tokens: 6000
        allowed-data-classes: [public, internal]
        region: us
      tier2:
        provider: openai
        model: gpt-5-chat # INVALID: OpenAI returned 404 in the M3 live run; tier2 is unused (synthesis runs on tier1) until the M6 evals pick a model
        max-completion-tokens: 6000
        allowed-data-classes: [public, internal]
        region: us
    embedding:
      provider: openai
      model: text-embedding-3-small
      dimensions: 1536
      allowed-data-classes: [public, internal]
      region: us
