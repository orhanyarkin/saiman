name: Terraform

# Static checks only: fmt, init -backend=false, validate and offline `terraform test` (mock providers).
# No cloud credentials and no OIDC role are used here. plan/infracost comments come with the demo-lite module.
on:
  pull_request:
    paths:
      - "deploy/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "deploy/terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: terraform (fmt, validate, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive deploy/terraform
      - name: terraform init -backend=false and validate
        run: |
          # Every root module and module directory (anything with a versions.tf).
          find deploy/terraform -name versions.tf -not -path '*/.terraform/*' -print0 |
            while IFS= read -r -d '' file; do
              dir="$(dirname "$file")"
              echo "::group::validate $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
              echo "::endgroup::"
            done
      - name: terraform test (mock providers, offline)
        run: |
          find deploy/terraform -name '*.tftest.hcl' -not -path '*/.terraform/*' -print0 |
            while IFS= read -r -d '' file; do
              dir="$(dirname "$(dirname "$file")")"
              echo "$dir"
            done | sort -u |
            while IFS= read -r dir; do
              echo "::group::test $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" test
              echo "::endgroup::"
            done
      - name: Bucket keeps prevent_destroy
        run: deploy/terraform/aws/bootstrap/tests/check-prevent-destroy.sh
      - name: demo-lite foundation checks (default tags, no IAM resources)
        run: deploy/terraform/aws/demo-lite/tests/check-foundation.sh
      - name: demo-lite task checks (secret reads, buyer key placement)
        run: deploy/terraform/aws/demo-lite/tests/check-task.sh
