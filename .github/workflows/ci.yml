name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded runs on PRs; a push to main (which also builds and, later,
  # publishes images) always runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (./gradlew check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: ./gradlew check
        run: ./gradlew check --continue
      # ADR-0008: the starter must work when consumed from a Maven repository with properties only.
      - name: Publish the x402 starter to mavenLocal
        run: ./gradlew :libs:x402-spring-boot-starter:publishToMavenLocal
      - name: Build the console-buyer sample against it
        run: ./gradlew -p libs/x402-spring-boot-starter/samples/console-buyer build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: "**/build/reports/tests"
          retention-days: 7

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Generated API clients must match docs/api/*.openapi.json (script added by the frontend task).
      - name: Generated API client is up to date
        run: |
          pnpm gen:api --check
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (fixture server)
        run: timeout 600 pnpm e2e
      - name: Lighthouse
        run: |
          timeout 600 pnpm lighthouse
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  compose-policy:
    name: compose policy (deploy/compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose config
        run: |
          docker compose -f deploy/compose/docker-compose.yml config --quiet
          docker compose -f deploy/compose/docker-compose.yml --profile apps config --quiet
          docker compose -f deploy/compose/docker-compose.yml --profile evals config --quiet
      - name: Check the dashboard nginx.conf
        run: scripts/check-nginx-conf.sh
      - name: Check compose policy
        run: scripts/check-compose-policy.sh
      - name: Self-test compose/x402-env/nginx policy, secret generation and capture scrubber scripts
        run: scripts/test-check-compose-policy.sh
      - name: Self-test the Postgres role bootstrap (throwaway containers)
        run: scripts/test-bootstrap-roles.sh
      - name: Self-test the agent usage-profile switch
        run: scripts/test-usage-profile.sh

  shellcheck:
    name: shellcheck (scripts, deploy, hooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck every tracked shell script (warning and above)
        # Official image, pinned by digest (koalaman/shellcheck v0.10.0); nothing is installed on the runner.
        run: |
          git ls-files '*.sh' | xargs docker run --rm -v "$PWD":/mnt -w /mnt \
            koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb -x -S warning

  images:
    name: images (bootBuildImage, ${{ matrix.runs-on }})
    needs: backend
    # Push to main of this repository only: never PRs (so never forks or Dependabot branches).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'orhanyarkin/saiman'
    timeout-minutes: 30
    # Scoped to this job; the workflow default stays contents: read.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # Build and push, one architecture per native runner (no QEMU, ADR-0007 update). The Spring Boot
      # plugin authenticates to ghcr.io itself from GITHUB_ACTOR/GITHUB_TOKEN (build-logic), so no
      # `docker login` is needed here and the token is only visible to this one step.
      # Tags are immutable `sha-<12>-<arch>`; the `images-manifest` job joins them. No `latest`.
      - name: ./gradlew bootBuildImage (publish sha-<12>-${{ matrix.arch }})
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./gradlew bootBuildImage -PimagePublish=true "-PimageTag=sha-${GITHUB_SHA::12}-${ARCH}"

  images-manifest:
    name: images (multi-arch manifest)
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'orhanyarkin/saiman'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Create sha-<12> manifests and verify both platforms
        run: |
          set -euo pipefail
          sha="sha-${GITHUB_SHA::12}"
          digests='{}'
          for svc in orchestrator seller-api ledger ingest evals; do
            repo="ghcr.io/orhanyarkin/saiman-${svc}"
            docker buildx imagetools create -t "${repo}:${sha}" "${repo}:${sha}-amd64" "${repo}:${sha}-arm64"
            out="$(docker buildx imagetools inspect "${repo}:${sha}")"
            printf '%s\n' "$out"
            # Provenance for demo-up (audit M1): the index digest this run created.
            digest="$(docker buildx imagetools inspect "${repo}:${sha}" --format '{{.Manifest.Digest}}')"
            digests="$(jq -c --arg k "$svc" --arg d "$digest" '. + {($k): $d}' <<<"$digests")"
            for platform in linux/amd64 linux/arm64; do
              if ! grep -q "Platform: *${platform}\$" <<<"$out"; then
                echo "::error::${repo}:${sha} is missing ${platform}"
                exit 1
              fi
            done
          done
          # digests.json: what demo-up must find again on GHCR (service -> index digest, plus the commit).
          jq -n --arg commit "$GITHUB_SHA" --argjson digests "$digests" '{commit: $commit, digests: $digests}' >"${RUNNER_TEMP}/digests.json"
      - name: Upload image digests (provenance for demo-up)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests
          path: ${{ runner.temp }}/digests.json
          retention-days: 30
