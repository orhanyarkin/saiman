name: demo-down

# Human-triggered teardown of the demo-lite stack (ADR-0028). All work is in demo-destroy.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    name: demo-down
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/demo-destroy.yml
    secrets: inherit
    with:
      only_if_expired: false
