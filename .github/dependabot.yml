version: 2

# One pull request per week for the code dependencies of every ecosystem (a multi-ecosystem group),
# instead of one PR per dependency. The group is reviewed and merged as a unit, so CI must stay green
# for all of it. Container images are deliberately NOT in that group: see the docker-compose entry.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    labels:
      - dependencies

# Every ecosystem waits 3 days after a release before proposing it (cooldown), so a bad or
# compromised release has time to be yanked before it reaches a PR. The cooldown does not apply to
# security updates, which Dependabot still opens on their own.
#
# Major versions are not proposed (ignore): a breaking bump would turn the whole weekly PR red and
# block the safe updates batched with it. Review majors by hand, for example once a quarter. Docker
# images matter most here: a major bump of the Postgres/pgvector, Kafka or Redis image changes the
# on-disk format of volumes that `make up` keeps (ADR-0001, ADR-0020). GitHub Actions are pinned by
# SHA and have no data to migrate, so their majors stay enabled. (The semver-*-days cooldown keys are not
# supported for github-actions, so the wait is the same 3 days for every bump size.)
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 3
    ignore:
      # Majors by hand (see above). This also keeps TypeScript on 5.9.x until typescript-eslint and
      # openapi-typescript support 6.x.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Container images get their own weekly pull request (the "images" group), not the multi-ecosystem one.
  # A compose image bump always needs a manual follow-up commit, because `local.images` in
  # demo-lite/containers.tf must carry the same tag (audit L4, ops/check-mirror-versions.sh) and Dependabot
  # cannot edit those HCL strings. In PR #52 that, plus one bad image tag, held up the Gradle, npm, Actions
  # and Terraform updates batched with it; separate pull requests keep an image problem to the images.
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    labels:
      - dependencies
    groups:
      images:
        patterns: ["*"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The collector stays out of scope, and an ignore rule cannot bring it back. It publishes
      # per-architecture tags beside the multi-arch index. The alphabetic ones (-arm64, -s390x,
      # -windows-2022-amd64, ...) read as prereleases and rank BELOW the plain tag, so they are never
      # proposed; -386 is numeric, so Dependabot normalises it into a fourth version segment (0.162.0.386)
      # that outranks 0.162.0. That is the 32-bit x86 image it proposed here, as it does in many other
      # repositories. Docker ignores take Bundler version syntax, which cannot express "any four-segment
      # version", so an ignore would need one exact entry per release. Bump it by hand instead (with the
      # majors, see above): the tag in docker-compose.yml and the index digest in demo-lite/containers.tf,
      # together. The current version is 0.163.1.
      - dependency-name: "otel/opentelemetry-collector"

  # Terraform provider versions of the AWS stacks (ADR-0028). Provider majors by hand.
  - package-ecosystem: terraform
    directory: /deploy/terraform/aws/bootstrap
    patterns: ["*"]
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /deploy/terraform/aws/demo-lite
    patterns: ["*"]
    multi-ecosystem-group: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
