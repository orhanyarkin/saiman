# Local stack for Saiman (ADR-0001, ADR-0004, ADR-0006, ADR-0007).
# Infra containers (postgres, redpanda, valkey, otel-collector, jaeger) run by default.
# App containers (orchestrator, seller-api, ledger, ingest) run under `--profile apps`;
# they are built with Spring Boot Buildpacks (`./gradlew bootBuildImage`), not Dockerfiles.
# All host ports are bound to 127.0.0.1 only. `evals` is a CLI, not a compose service.

name: saiman

x-app-common: &app-common
  profiles: ["apps"]
  mem_limit: 768m
  pull_policy: never
  restart: on-failure
  # Per-service secrets follow ADR-0009: seller-api never holds a private key, only the
  # public X402_SELLER_PAYTO_ADDRESS (plain env var, set below); no app container gets
  # an env_file, so none can see the others' secrets. The x402 buyer key reaches only
  # the orchestrator, from M3, through compose `secrets:` mounted at /run/secrets/ and
  # read with `spring.config.import=optional:configtree:/run/secrets/` — not before.
  environment: &app-common-env
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/saiman
    SPRING_DATASOURCE_USERNAME: saiman
    SPRING_DATASOURCE_PASSWORD: saiman
    SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    SPRING_DATA_REDIS_URL: redis://valkey:6379
    # Boot 4.1's spring-boot-starter-opentelemetry reads the standard OTEL_* env vars
    # and appends /v1/traces, /v1/metrics, /v1/logs itself (confirmed by T0).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    # Boot 4.1 services default management.otlp.metrics.export.enabled=false; turn it
    # on for the local stack so the collector's debug exporter has something to show.
    MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
    # Paketo tiny run images size the JVM's thread pool from container memory by
    # default; cap it explicitly to keep four ~768 MB app containers predictable.
    BPL_JVM_THREAD_COUNT: "50"
  depends_on: &app-common-depends-on
    otel-collector:
      condition: service_started
  # Paketo "tiny" buildpack images have no shell, so compose cannot exec a healthcheck
  # here; the host polls /actuator/health instead (see scripts/wait-for-health.sh, ADR-0007).

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: saiman
      POSTGRES_USER: saiman
      POSTGRES_PASSWORD: saiman
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U saiman -d saiman"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
    ports:
      # Only the external listener (container port 19092) is published, as
      # 127.0.0.1:9092, so both host tools and the container's own advertised
      # address agree on "localhost:9092". The internal listener (container port
      # 9092, advertised as redpanda:9092) is reachable only from other containers
      # on the compose network.
      - "127.0.0.1:9092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:\\s+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    ports:
      # Defaults to 16380 because 6379 and 16379 clash with a native Redis on Windows;
      # override with VALKEY_HOST_PORT if 16380 is taken too.
      - "127.0.0.1:${VALKEY_HOST_PORT:-16380}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector:0.161.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      jaeger:
        condition: service_started
    # No healthcheck: the core distribution image has no shell to exec a probe command
    # (ADR-0007 R8 applies to the collector too). `make infra-up` waits for it as "running".

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    # OTLP receiver ports (4317/4318) are enabled by default but intentionally not
    # published to the host: only otel-collector talks to Jaeger, over the compose
    # network, avoiding a port clash with the collector's own host-mapped 4317/4318.
    # No healthcheck: distroless image, no shell (see otel-collector above).

  orchestrator:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-orchestrator:dev
    ports:
      - "127.0.0.1:8080:8080"
    # Buyer key + OpenAI key as file secrets (ADR-0009 amendments). Long syntax with `target:`
    # names the mounted file /run/secrets/x402.client.private-key, so the configtree import
    # exposes it as the property `x402.client.private-key`. No key-shaped environment entries:
    # scripts/check-compose-policy.sh forbids them. An empty key file = paid runs fail closed.
    secrets:
      - source: x402_buyer_private_key
        target: x402.client.private-key
      - openai_api_key
    environment:
      <<: *app-common-env
      # Same public payout address the seller uses (required by `make up`, see seller-api
      # below): the orchestrator only pays this payee (payee allowlist, rule 3).
      X402_CLIENT_ALLOWED_PAY_TO: ${X402_SELLER_PAYTO_ADDRESS:-}
      # Plaintext x402 payments are allowed to the compose-internal seller alone (exact host).
      # The starter refuses to start with a non-empty plaintext allowlist unless redirects
      # are not followed, hence the second entry.
      X402_CLIENT_ALLOWED_PLAINTEXT_HOSTS: seller-api
      SPRING_HTTP_CLIENTS_REDIRECTS: dont-follow
      SAIMAN_SELLER_BASE_URL: http://seller-api:8081
      SAIMAN_ROUTER_REQUIRE_COST_SCOPE: "true"
      SAIMAN_ROUTER_MAX_SCOPE_BUDGET_USD_MICROS: "150000"
      # DNS-rebinding guard for /api/** (saiman.orchestrator.api.allowed-hosts, a list bound
      # from a comma-separated value).
      SAIMAN_ORCHESTRATOR_API_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],orchestrator,orchestrator:8080,localhost:8080,127.0.0.1:8080
      # A payment strictly above 10000 atomic waits for a human approval: the 0.02 USDC
      # questions tool does, the 0.01 USDC summary tool does not (USDC has 6 decimals).
      SAIMAN_ORCHESTRATOR_SPEND_APPROVAL_THRESHOLD_ATOMIC: "10000"
    depends_on:
      <<: *app-common-depends-on
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # No shell in the image, so no healthcheck: started is the strongest signal compose has;
      # `make up` polls /actuator/health on the host (scripts/wait-for-health.sh).
      seller-api:
        condition: service_started

  seller-api:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-seller-api:dev
    ports:
      - "127.0.0.1:8081:8081"
    secrets:
      - openai_api_key
    environment:
      <<: *app-common-env
      # Where the RAG-backed disclosure endpoints reach ingest's internal API (M2).
      SELLER_INGEST_BASE_URL: http://ingest:8083
      SELLER_DISCLOSURES_SOURCE: rag
      # Public payout address only, no private key (ADR-0009). Left unset here on
      # purpose: `${X402_SELLER_PAYTO_ADDRESS:-}` keeps `docker compose config` (and
      # the `infra-up`/compose-policy paths, which never set it) working without a
      # warning; the app itself fails closed at startup on a missing/invalid value,
      # and `make up` fails even earlier via scripts/check-x402-env.sh. No
      # X402_FACILITATOR_URL here: the property doesn't bind to
      # `x402.server.facilitator.url`, and the starter host-allowlists the facilitator
      # (x402.org + loopback) in code rather than taking it from config.
      X402_SELLER_PAYTO_ADDRESS: ${X402_SELLER_PAYTO_ADDRESS:-}
    depends_on:
      <<: *app-common-depends-on
      valkey:
        condition: service_healthy
      ingest:
        condition: service_started

  ledger:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-ledger:dev
    ports:
      - "127.0.0.1:8082:8082"

  ingest:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-ingest:dev
    ports:
      # /internal/** has NO in-app authentication (ADR-0012): this port must stay bound to
      # loopback and must never be published beyond 127.0.0.1 or sit behind a load balancer.
      - "127.0.0.1:8083:8083"
    # MKK credential + OpenAI key, mounted at /run/secrets/<name> and read through
    # `spring.config.import=optional:configtree:/run/secrets/` (ADR-0009 M2 amendment).
    # No OPENAI_* environment variables: scripts/check-compose-policy.sh forbids them.
    secrets:
      - mkk_credentials
      - openai_api_key
    depends_on:
      <<: *app-common-depends-on
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

# File-backed secrets under the ignored repo-root secrets/ dir. `make up` creates missing
# ones as empty files (scripts/ensure-secret-files.sh); the apps fail closed on use. The
# buyer key is created by the human only (never generated by tooling).
secrets:
  x402_buyer_private_key:
    file: ../../secrets/x402_buyer_private_key
  mkk_credentials:
    file: ../../secrets/mkk_credentials
  openai_api_key:
    file: ../../secrets/openai_api_key

volumes:
  postgres_data:
  redpanda_data:
  valkey_data:
