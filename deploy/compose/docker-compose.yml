# Local stack for Saiman (ADR-0001, ADR-0004, ADR-0006, ADR-0007, ADR-0023, ADR-0024).
# Infra containers (postgres, kafka, redis, otel-collector, jaeger) and the one-shot `db-init`
# (per-service Postgres roles) run by default.
# App containers (orchestrator, seller-api, ledger, ingest) run under `--profile apps`;
# they are built with Spring Boot Buildpacks (`./gradlew bootBuildImage`), not Dockerfiles.
# `evals` is a one-shot CLI container under `--profile evals` (`make eval`, ADR-0025).
# All host ports are bound to 127.0.0.1 only.

name: saiman

x-app-common: &app-common
  profiles: ["apps"]
  mem_limit: 768m
  pull_policy: never
  restart: on-failure
  # Per-service secrets follow ADR-0009: seller-api never holds a private key, only the
  # public X402_SELLER_PAYTO_ADDRESS (plain env var, set below); no app container gets
  # an env_file, so none can see the others' secrets. The x402 buyer key reaches only
  # the orchestrator, from M3, through compose `secrets:` mounted at /run/secrets/ and
  # read with `spring.config.import=optional:configtree:/run/secrets/` — not before.
  environment: &app-common-env
    # Each service sets SPRING_DATASOURCE_USERNAME=<svc>_app (runtime, DML only) and
    # SPRING_FLYWAY_USER=<svc>_owner (migrations only); the passwords arrive as file secrets
    # (spring.datasource.password / spring.flyway.password, ADR-0024). The `saiman` superuser
    # belongs to db-init and psql only; scripts/check-compose-policy.sh enforces this.
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/saiman
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_DATA_REDIS_URL: redis://redis:6379
    # Boot 4.1's spring-boot-starter-opentelemetry reads the standard OTEL_* env vars
    # and appends /v1/traces, /v1/metrics, /v1/logs itself (confirmed by T0).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    # Boot 4.1 services default management.otlp.metrics.export.enabled=false; turn it
    # on for the local stack so the collector's debug exporter has something to show.
    MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
    # Paketo tiny run images size the JVM's thread pool from container memory by
    # default; cap it explicitly to keep four ~768 MB app containers predictable.
    BPL_JVM_THREAD_COUNT: "50"
  depends_on: &app-common-depends-on
    otel-collector:
      condition: service_started
    db-init:
      condition: service_completed_successfully
  # Paketo "tiny" buildpack images have no shell, so compose cannot exec a healthcheck
  # here; the host polls /actuator/health instead (see scripts/wait-for-health.sh, ADR-0007).

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: saiman
      POSTGRES_USER: saiman
      POSTGRES_PASSWORD: saiman
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U saiman -d saiman"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot, idempotent bootstrap of the per-service roles, schemas and object ownership
  # (ADR-0024). Runs as the superuser, the only container besides postgres that holds its
  # password. Apps wait for it with service_completed_successfully. `make infra-up`/`make up`
  # run it explicitly (docker compose run --rm db-init) in addition: `up --wait` treats a
  # one-shot as a failure on some Compose versions.
  db-init:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: "no"
    pull_policy: missing
    entrypoint: ["bash", "/bootstrap/bootstrap-roles.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: saiman
      PGUSER: saiman
      PGPASSWORD: saiman
    secrets:
      - pg_orchestrator_owner_password
      - pg_orchestrator_app_password
      - pg_ledger_owner_password
      - pg_ledger_app_password
      - pg_seller_api_owner_password
      - pg_seller_api_app_password
      - pg_ingest_owner_password
      - pg_ingest_app_password
    volumes:
      - ./postgres:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    # Apache Kafka in KRaft mode, one node acting as broker and controller (ADR-0020). Plain Kafka has
    # no HTTP proxy or schema registry to switch off; Kafka itself stays unauthenticated until M6
    # (docs/THREAT_MODEL.md). The KAFKA_* variables map onto server.properties.
    environment:
      # Fixed so the persisted log directory keeps matching the cluster across restarts.
      CLUSTER_ID: c2FpbWFuLWxvY2FsLWthZg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # A single node can hold one replica of the internal topics only.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Every topic is declared by the services (Spring Kafka NewTopic beans); peers must not create others.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      # Only the external listener (container port 19092) is published, as
      # 127.0.0.1:9092, so both host tools and the broker's advertised address
      # agree on "localhost:9092". The internal listener (container port 9092,
      # advertised as kafka:9092) is reachable only from other containers on the
      # compose network; the controller listener stays inside the container.
      - "127.0.0.1:9092:19092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    ports:
      # Defaults to 16380 because 6379 and 16379 clash with a native Redis on Windows;
      # override with REDIS_HOST_PORT if 16380 is taken too.
      - "127.0.0.1:${REDIS_HOST_PORT:-16380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector:0.161.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      jaeger:
        condition: service_started
    # No healthcheck: the core distribution image has no shell to exec a probe command
    # (ADR-0007 R8 applies to the collector too). `make infra-up` waits for it as "running".

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    # OTLP receiver ports (4317/4318) are enabled by default but intentionally not
    # published to the host: only otel-collector talks to Jaeger, over the compose
    # network, avoiding a port clash with the collector's own host-mapped 4317/4318.
    # No healthcheck: distroless image, no shell (see otel-collector above).

  orchestrator:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-orchestrator:dev
    ports:
      - "127.0.0.1:8080:8080"
    # Buyer key + OpenAI key as file secrets (ADR-0009 amendments). Long syntax with `target:`
    # names the mounted file /run/secrets/x402.client.private-key, so the configtree import
    # exposes it as the property `x402.client.private-key`. No key-shaped environment entries:
    # scripts/check-compose-policy.sh forbids them. An empty key file = the orchestrator fails closed at startup (ADR-0008) and `make up` skips its health wait.
    secrets:
      - source: x402_buyer_private_key
        target: x402.client.private-key
      - openai_api_key
      - source: pg_orchestrator_owner_password
        target: spring.flyway.password
      - source: pg_orchestrator_app_password
        target: spring.datasource.password
    environment:
      <<: *app-common-env
      SPRING_DATASOURCE_USERNAME: orchestrator_app
      SPRING_FLYWAY_USER: orchestrator_owner
      # SHA-256 digests (not secrets) of the human role tokens, computed from secrets/api_*_token by
      # scripts/with-auth-digests.sh (`make up`). The raw tokens are never mounted (ADR-0023).
      SAIMAN_AUTH_READER_TOKEN_SHA256: ${SAIMAN_AUTH_READER_TOKEN_SHA256:-}
      SAIMAN_AUTH_OPERATOR_TOKEN_SHA256: ${SAIMAN_AUTH_OPERATOR_TOKEN_SHA256:-}
      # Same public payout address the seller uses (required by `make up`, see seller-api
      # below): the orchestrator only pays this payee (payee allowlist, rule 3).
      X402_CLIENT_ALLOWED_PAY_TO: ${X402_SELLER_PAYTO_ADDRESS:-}
      # Plaintext x402 payments are allowed to the compose-internal seller alone (exact host).
      # The starter refuses to start with a non-empty plaintext allowlist unless redirects
      # are not followed, hence the second entry.
      X402_CLIENT_ALLOWED_PLAINTEXT_HOSTS: seller-api
      SPRING_HTTP_CLIENTS_REDIRECTS: dont-follow
      SAIMAN_SELLER_BASE_URL: http://seller-api:8081
      SAIMAN_ROUTER_REQUIRE_COST_SCOPE: "true"
      SAIMAN_ROUTER_MAX_SCOPE_BUDGET_USD_MICROS: "150000"
      # DNS-rebinding guard for /api/** (saiman.orchestrator.api.allowed-hosts, a list bound
      # from a comma-separated value).
      SAIMAN_ORCHESTRATOR_API_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],orchestrator,orchestrator:8080,localhost:8080,127.0.0.1:8080
      # A payment strictly above 10000 atomic waits for a human approval: the 0.02 USDC
      # questions tool does, the 0.01 USDC summary tool does not (USDC has 6 decimals).
      SAIMAN_ORCHESTRATOR_SPEND_APPROVAL_THRESHOLD_ATOMIC: "10000"
      # M4 (ADR-0018): HeldPaymentResolver reads chain state;
      # chain reads go only to the public Base Sepolia RPC (not a secret; testnet
      # only). The allowlist is the exact host; scripts/check-compose-policy.sh pins both.
      SAIMAN_CHAIN_RPC_URL: https://sepolia.base.org
      SAIMAN_CHAIN_ALLOWED_HOSTS: sepolia.base.org
    depends_on:
      <<: *app-common-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # No shell in the image, so no healthcheck: started is the strongest signal compose has;
      # `make up` polls /actuator/health on the host (scripts/wait-for-health.sh).
      seller-api:
        condition: service_started

  seller-api:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-seller-api:dev
    ports:
      - "127.0.0.1:8081:8081"
    secrets:
      - openai_api_key
      - source: pg_seller_api_owner_password
        target: spring.flyway.password
      - source: pg_seller_api_app_password
        target: spring.datasource.password
    environment:
      <<: *app-common-env
      SPRING_DATASOURCE_USERNAME: seller_api_app
      SPRING_FLYWAY_USER: seller_api_owner
      # Digests of the per-caller service tokens that may use /internal/** (ADR-0023).
      SAIMAN_AUTH_SERVICE_TOKENS_LEDGER_SHA256: ${SAIMAN_AUTH_SERVICE_TOKENS_LEDGER_SHA256:-}
      SAIMAN_AUTH_SERVICE_TOKENS_EVALS_SHA256: ${SAIMAN_AUTH_SERVICE_TOKENS_EVALS_SHA256:-}
      # Where the RAG-backed disclosure endpoints reach ingest's internal API (M2).
      SELLER_INGEST_BASE_URL: http://ingest:8083
      SELLER_DISCLOSURES_SOURCE: rag
      # Public payout address only, no private key (ADR-0009). Left unset here on
      # purpose: `${X402_SELLER_PAYTO_ADDRESS:-}` keeps `docker compose config` (and
      # the `infra-up`/compose-policy paths, which never set it) working without a
      # warning; the app itself fails closed at startup on a missing/invalid value,
      # and `make up` fails even earlier via scripts/check-x402-env.sh. No
      # X402_FACILITATOR_URL here: the property doesn't bind to
      # `x402.server.facilitator.url`, and the starter host-allowlists the facilitator
      # (x402.org + loopback) in code rather than taking it from config.
      X402_SELLER_PAYTO_ADDRESS: ${X402_SELLER_PAYTO_ADDRESS:-}
      # M4b (ADR-0021): exact Host values for /internal/credit-notes/{key}, which the ledger reads to
      # corroborate credit notes; the published 127.0.0.1:8081 (Host localhost:8081) is refused.
      # scripts/check-compose-policy.sh pins it.
      SELLER_INTERNAL_ALLOWED_HOSTS: seller-api,seller-api:8081
    depends_on:
      <<: *app-common-depends-on
      redis:
        condition: service_healthy
      # M4: seller-api records settlements in its own schema (seller_api) and publishes payment events to Kafka.
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ingest:
        condition: service_started

  ledger:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-ledger:dev
    ports:
      # Bearer-token authenticated since M6 (ADR-0023); still bound to loopback.
      - "127.0.0.1:8082:8082"
    secrets:
      - source: pg_ledger_owner_password
        target: spring.flyway.password
      - source: pg_ledger_app_password
        target: spring.datasource.password
      # The ledger's own service token for seller-api's /internal/credit-notes (ADR-0021, ADR-0023).
      - source: seller_service_token_ledger
        target: saiman.ledger.seller.service-token
    environment:
      <<: *app-common-env
      SPRING_DATASOURCE_USERNAME: ledger_app
      SPRING_FLYWAY_USER: ledger_owner
      SAIMAN_AUTH_READER_TOKEN_SHA256: ${SAIMAN_AUTH_READER_TOKEN_SHA256:-}
      SAIMAN_AUTH_OPERATOR_TOKEN_SHA256: ${SAIMAN_AUTH_OPERATOR_TOKEN_SHA256:-}
      # M4 (ADR-0018): chain reads go only to the public Base Sepolia RPC (not a secret; testnet
      # only). The allowlist is the exact host; scripts/check-compose-policy.sh pins both.
      SAIMAN_CHAIN_RPC_URL: https://sepolia.base.org
      SAIMAN_CHAIN_ALLOWED_HOSTS: sepolia.base.org
      # DNS-rebinding guard for /api/** (saiman.ledger.api.allowed-hosts, a comma-separated list).
      SAIMAN_LEDGER_API_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],ledger,ledger:8082,localhost:8082,127.0.0.1:8082
      # M4b (ADR-0021): reconciliation asks seller-api whether a CreditNoteIssued read from Kafka is real.
      # Plain http only to the compose-internal seller; scripts/check-compose-policy.sh pins both values.
      # Seller unreachable = the credited payment stays PENDING (no depends_on needed).
      SAIMAN_LEDGER_SELLER_BASE_URL: http://seller-api:8081
      SAIMAN_LEDGER_SELLER_ALLOWED_HOSTS: seller-api
    # Topics are created by the producers' NewTopic beans (Spring Kafka KafkaAdmin) at startup;
    # compose does not pre-create them. The ledger consumes payments.* and publishes ledger.*.
    depends_on:
      <<: *app-common-depends-on
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ingest:
    <<: *app-common
    image: ghcr.io/orhanyarkin/saiman-ingest:dev
    ports:
      # /internal/** has NO in-app authentication (ADR-0012): this port must stay bound to
      # loopback and must never be published beyond 127.0.0.1 or sit behind a load balancer.
      - "127.0.0.1:8083:8083"
    # MKK credential + OpenAI key, mounted at /run/secrets/<name> and read through
    # `spring.config.import=optional:configtree:/run/secrets/` (ADR-0009 M2 amendment).
    # No OPENAI_* environment variables: scripts/check-compose-policy.sh forbids them.
    secrets:
      - mkk_credentials
      - openai_api_key
      - source: pg_ingest_owner_password
        target: spring.flyway.password
      - source: pg_ingest_app_password
        target: spring.datasource.password
    environment:
      <<: *app-common-env
      SPRING_DATASOURCE_USERNAME: ingest_app
      SPRING_FLYWAY_USER: ingest_owner
    depends_on:
      <<: *app-common-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dashboard (M5, ADR-0022): nginx serves web/dist and path-routes /api and /otlp to the
  # backends on one origin. No environment, secrets or env_file; scripts/check-compose-policy.sh
  # and scripts/check-nginx-conf.sh pin that. `make up` builds web/dist first (make web-build).
  web:
    image: nginx:1.30.5-alpine
    profiles: ["apps"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ../../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orchestrator:
        condition: service_started
      ledger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Eval harness (M6, ADR-0025): a one-shot CLI, run by `make eval`. On the compose network so the
  # Host allowlists of ingest and seller-api hold. Its only secret is its own service token; its
  # only writable mount is build/evals (reports). scripts/check-compose-policy.sh pins both.
  evals:
    image: ghcr.io/orhanyarkin/saiman-evals:dev
    profiles: ["evals"]
    pull_policy: never
    restart: "no"
    mem_limit: 768m
    environment:
      SAIMAN_EVALS_INGEST_BASE_URL: http://ingest:8083
      SAIMAN_EVALS_SELLER_BASE_URL: http://seller-api:8081
      SAIMAN_EVALS_OUTPUT_DIR: /out
      # `make eval EVAL_ANSWERS=1` turns the answer tier (real LLM spend, day-capped) on.
      SAIMAN_EVALS_ANSWERS_ENABLED: ${SAIMAN_EVALS_ANSWERS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      BPL_JVM_THREAD_COUNT: "50"
    secrets:
      - source: seller_service_token_evals
        target: saiman.evals.seller.service-token
    volumes:
      - ../../build/evals:/out

# File-backed secrets under the ignored repo-root secrets/ dir. `make up` creates the missing
# ones (scripts/ensure-secret-files.sh): credentials as empty files (the apps fail closed on
# use; the buyer key is created by the human only), the per-service DB passwords and the
# service tokens as random values. The human role tokens api_reader_token / api_operator_token
# are generated there too but are never mounted anywhere.
secrets:
  x402_buyer_private_key:
    file: ../../secrets/x402_buyer_private_key
  mkk_credentials:
    file: ../../secrets/mkk_credentials
  openai_api_key:
    file: ../../secrets/openai_api_key
  pg_orchestrator_owner_password:
    file: ../../secrets/pg_orchestrator_owner_password
  pg_orchestrator_app_password:
    file: ../../secrets/pg_orchestrator_app_password
  pg_ledger_owner_password:
    file: ../../secrets/pg_ledger_owner_password
  pg_ledger_app_password:
    file: ../../secrets/pg_ledger_app_password
  pg_seller_api_owner_password:
    file: ../../secrets/pg_seller_api_owner_password
  pg_seller_api_app_password:
    file: ../../secrets/pg_seller_api_app_password
  pg_ingest_owner_password:
    file: ../../secrets/pg_ingest_owner_password
  pg_ingest_app_password:
    file: ../../secrets/pg_ingest_app_password
  seller_service_token_ledger:
    file: ../../secrets/seller_service_token_ledger
  seller_service_token_evals:
    file: ../../secrets/seller_service_token_evals

volumes:
  postgres_data:
  kafka_data:
  redis_data:
