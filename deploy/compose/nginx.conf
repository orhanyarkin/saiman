# Dashboard web server (ADR-0022): serves web/dist and routes same-origin paths to the backends.
# Mounted read-only as /etc/nginx/conf.d/default.conf of the `web` compose service (http context).
# scripts/check-nginx-conf.sh enforces the binding rules: no Access-Control-*, no fixed Host,
# the 444 default server. There is no CORS and no OPTIONS handling on purpose: the SPA is
# same-origin and the backends' CSRF guard relies on the missing preflight answer.

# Docker's embedded DNS. Upstreams are resolved per request (variables below), so nginx starts
# even when an app container is down or restarting, and answers 502 instead of failing to boot.
resolver 127.0.0.11 valid=10s ipv6=off;

# Anything that is not addressed to localhost/127.0.0.1 (DNS rebinding, stray Host headers)
# gets the connection closed without a response.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    # Host headers carry the port (localhost:8088); nginx matches server_name without it.
    server_name localhost 127.0.0.1;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers. Do not use add_header inside a location: nginx then drops these.
    # The SPA only talks to its own origin (/api, /otlp), so everything is 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Backends: original URI, original Host (backends guard on it), no rewriting -----------
    # With a variable in proxy_pass and no URI part, nginx forwards the request URI unchanged.

    # Server-Sent Events: no buffering, HTTP/1.1, read timeout above the 15 s heartbeat.
    location ~ ^/api/v1/runs/[^/]+/events$ {
        set $orchestrator http://orchestrator:8080;
        proxy_pass $orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
    }

    # Ledger namespace (must stay disjoint from the orchestrator's).
    location ^~ /api/v1/ledger/ {
        set $ledger http://ledger:8082;
        proxy_pass $ledger;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }

    location ^~ /api/v1/reconciliation/ {
        set $ledger http://ledger:8082;
        proxy_pass $ledger;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }

    # Everything else under /api belongs to the orchestrator.
    location ^~ /api/ {
        set $orchestrator http://orchestrator:8080;
        proxy_pass $orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }

    # Browser traces (OTLP/HTTP). The collector serves /v1/traces, so the /otlp prefix is
    # the one deliberate rewrite (same as the Vite dev proxy in web/proxy.ts).
    location = /otlp/v1/traces {
        # `set` must come before `rewrite ... break`, which ends script processing.
        set $collector http://otel-collector:4318;
        rewrite ^/otlp(/.*)$ $1 break;
        proxy_pass $collector;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }

    # --- Static SPA --------------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback for deep links such as /runs/<id>.
    location / {
        try_files $uri /index.html;
    }
}
