spring:
  application:
    name: ingest
  threads:
    virtual:
      enabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
# OTLP endpoint is intentionally unset here: no exporter configured means tests stay quiet.
# Compose sets MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT for the running container.
