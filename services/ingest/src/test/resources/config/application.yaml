# Test-wide defaults, layered over src/main/resources/application.yaml.
management:
  health:
    redis:
      # No Redis in these tests (the router's cost guard is never called: tests use their own ModelRouter).
      enabled: false
  opentelemetry:
    # Keep a developer's exported OTEL_* variables from sending test telemetry to a collector.
    map-environment-variables: false

saiman:
  test:
    db:
      # The pool runs as ingest_app (DML only) and Flyway as ingest_owner, as in production (ADR-0024).
      runtime-role: app
  ingest:
    mkk:
      # base-url is set per test run by IngestIntegrationTests (fake MKK server)
      credentials: c3ludGhldGljOm1hcmtlci1OT1QtQS1TRUNSRVQ=
      rate-per-minute: 600000
      empty-page-step: 2000
      retry-wait: 1ms
      retry-attempts: 4
      circuit-open-wait: 300ms
    tickers: THYAO,ASELS,NOSUCH
