spring:
  application:
    name: evals
  main:
    web-application-type: none
  threads:
    virtual:
      enabled: true

saiman:
  evals:
    # src/test/resources/config/application.yaml turns this off for every test.
    run-on-startup: true

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
# evals is a CLI and not a compose service; export is enabled by the environment that runs it.
