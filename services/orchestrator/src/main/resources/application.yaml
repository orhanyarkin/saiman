spring:
  application:
    name: orchestrator
  threads:
    virtual:
      enabled: true
  config:
    # Docker/compose secrets (ADR-0009): one file per secret, e.g. /run/secrets/x402.client.private-key.
    import: "optional:configtree:${saiman.secrets-dir:/run/secrets/}"
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saiman}
    username: ${SPRING_DATASOURCE_USERNAME:saiman}
    password: ${SPRING_DATASOURCE_PASSWORD:saiman}
    hikari:
      schema: orchestrator
  flyway:
    schemas: orchestrator
    default-schema: orchestrator
    create-schemas: true

server:
  port: 8080

saiman:
  orchestrator:
    seller:
      base-url: ${SAIMAN_SELLER_BASE_URL:http://seller-api:8081} # config only; no tool takes a URL
    # Spend control (ADR-0013). USDC atomic units (6 decimals): 10000 = 0.01 USDC.
    spend:
      daily-cap-atomic: 1000000
      default-run-budget-atomic: 50000
      max-run-budget-atomic: 200000
      # Strictly above this, a payment waits for a human. Must stay below x402.client.max-amount-per-request
      # (20000), else nothing ever needs approval (startup logs a WARN).
      approval-threshold-atomic: 10000
      approval-timeout: 5m
      max-paid-calls-per-run: 4
      max-tool-calls-per-run: 6
    runs:
      max-concurrent: 2 # the seller allows 2 in-flight runs per payer; the orchestrator is one wallet
      llm-budget-usd-micros: 150000
    agents:
      # TIER2 per ADR-0014; set tier1 while the tier2 model id is unverified (T6 live runs).
      synthesis-tier: tier2
  # Model router (ADR-0011): every orchestrator LLM call must name its run as the cost scope, and no
  # scope may be given more than $0.15. The daily cap and the scopes live in Valkey (spring.data.redis).
  router:
    require-cost-scope: true
    max-scope-budget-usd-micros: 150000
    openai:
      max-retries: 0 # a retried call is billed twice; the router's fallback route covers outages

x402:
  client:
    # private-key comes only from the mounted secret file (configtree above), never from here.
    max-amount-per-request: 20000
    allowed-pay-to: ${X402_SELLER_PAYTO_ADDRESS:}
    # allowed-plaintext-hosts is deliberately not defaulted here: only the compose environment sets
    # it (X402_CLIENT_ALLOWED_PLAINTEXT_HOSTS=seller-api), so any other deployment pays over https only.

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
    info:
      access: read-only
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
# Actuator: only health and info exist at all (access), not just over HTTP (exposure).
# Telemetry export is off unless the runtime turns it on, so tests and a plain `bootRun` never
# reach for a collector. Compose sets OTEL_EXPORTER_OTLP_ENDPOINT (Boot 4.1 maps it to the
# trace exporter) and MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true (ADR-0006).
