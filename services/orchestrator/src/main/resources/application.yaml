spring:
  application:
    name: orchestrator
  threads:
    virtual:
      enabled: true
  config:
    # Docker/compose secrets (ADR-0009): one file per secret, e.g. /run/secrets/x402.client.private-key.
    import: "optional:configtree:${saiman.secrets-dir:/run/secrets/}"
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saiman}
    username: ${SPRING_DATASOURCE_USERNAME:saiman}
    password: ${SPRING_DATASOURCE_PASSWORD:saiman}
    hikari:
      schema: orchestrator
  flyway:
    schemas: orchestrator
    default-schema: orchestrator
    create-schemas: true
  # Transactional outbox (ADR-0016). libs/eventing sets the registry defaults (only @ApplicationModuleListener
  # publications are persisted, republish on restart, completed rows deleted); V6 owns the table.
  modulith:
    events:
      jdbc:
        schema: orchestrator
      kafka:
        # OutboxConfiguration's StringJacksonJsonMessageConverter writes the documented JSON as a String value
        # with no __TypeId__ header (as in the ledger); Modulith's byte-array converter is off.
        enable-json: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Bounded, so an unreachable broker fails a publication quickly: it stays incomplete in the registry
      # and is resubmitted later (saiman.orchestrator.outbox) or on restart. A run never waits for Kafka.
      properties:
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    admin:
      operation-timeout: 10s

server:
  port: 8080
  # Boot's /error fallback must not echo the request: no path, message, trace or binding details.
  error:
    include-path: never
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

# The OpenAPI contract (ADR-0022) is generated only by OpenApiContractTests; a running service serves no
# /v3/api-docs and no UI. springdoc has no UI module on the classpath either.
springdoc:
  api-docs:
    enabled: false

saiman:
  orchestrator:
    seller:
      base-url: ${SAIMAN_SELLER_BASE_URL:http://seller-api:8081} # config only; no tool takes a URL
      # The seller answers a paid call only after /settle, up to validBefore (<= 60 s ahead): startup
      # refuses anything below 65s.
      read-timeout: 65s
      # seller.llm.max-runs-per-payer-per-hour on the seller; startup WARNs if spend.max-paid-calls-per-hour
      # is above it.
      max-paid-calls-per-hour-at-seller: 30
    # Spend control (ADR-0013). USDC atomic units (6 decimals): 10000 = 0.01 USDC.
    spend:
      daily-cap-atomic: 1000000
      default-run-budget-atomic: 50000
      max-run-budget-atomic: 200000
      # Strictly above this, a payment waits for a human. Must stay below x402.client.max-amount-per-request
      # (20000), else nothing ever needs approval (startup logs a WARN).
      approval-threshold-atomic: 10000
      approval-timeout: 5m
      max-paid-calls-per-run: 4
      max-tool-calls-per-run: 6
      # Across all runs, per rolling hour; below the seller's 30 per payer, leaving room for cache
      # hits and a manual rag-ask with the same wallet.
      max-paid-calls-per-hour: 25
    runs:
      max-concurrent: 2 # the seller allows 2 in-flight runs per payer; the orchestrator is one wallet
      llm-budget-usd-micros: 150000
      deadline: 15m # wall clock per run; past it the run fails RUN_DEADLINE (pending approvals expire)
    # Payment events to the ledger (ADR-0016): a publication Kafka did not acknowledge is resubmitted once it
    # is older than resubmit-older-than (longer than one bounded send attempt, so an in-flight one is not
    # resent; a duplicate would be harmless anyway, the ledger dedupes on the event id).
    outbox:
      resubmit-interval: 1m
      resubmit-older-than: 2m
    # HELD intents resolved from the chain (ADR-0018); active only when saiman.chain.rpc-url is set.
    held-resolution:
      interval: 2m
      batch-size: 20
      # Blocks searched for the AuthorizationUsed log before validBefore (Base Sepolia: 2 s per block).
      log-window-blocks: 300
    agents:
      # TIER2 per ADR-0014; set tier1 while the tier2 model id is unverified (T6 live runs).
      synthesis-tier: tier1 # tier2 (gpt-5-chat) returned 404 in the first live run (M3 T6); tier1 (gpt-5-mini) is verified live
  # Model router (ADR-0011): every orchestrator LLM call must name its run as the cost scope, and no
  # scope may be given more than $0.15. The daily cap and the scopes live in Redis (spring.data.redis).
  router:
    require-cost-scope: true
    max-scope-budget-usd-micros: 150000
    openai:
      max-retries: 0 # a retried call is billed twice; the router's fallback route covers outages

x402:
  client:
    # private-key comes only from the mounted secret file (configtree above), never from here.
    max-amount-per-request: 20000
    allowed-pay-to: ${X402_SELLER_PAYTO_ADDRESS:}
    # allowed-plaintext-hosts is deliberately not defaulted here: only the compose environment sets
    # it (X402_CLIENT_ALLOWED_PLAINTEXT_HOSTS=seller-api), so any other deployment pays over https only.

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
    info:
      access: read-only
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
# Actuator: only health and info exist at all (access), not just over HTTP (exposure).
# Telemetry export is off unless the runtime turns it on, so tests and a plain `bootRun` never
# reach for a collector. Compose sets OTEL_EXPORTER_OTLP_ENDPOINT (Boot 4.1 maps it to the
# trace exporter) and MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true (ADR-0006).
