spring:
  application:
    name: ledger
  threads:
    virtual:
      enabled: true
  config:
    # Docker/compose secrets (ADR-0009): one file per secret under /run/secrets, named after the property it sets
    # (spring.datasource.password, spring.flyway.password, saiman.ledger.seller.service-token).
    import: "optional:configtree:${saiman.secrets-dir:/run/secrets/}"
  mvc:
    problemdetails:
      enabled: true
  # API only: no static resources. An unknown path is then a NoHandlerFoundException that the service's
  # ApiExceptionHandler renders with fixed text, instead of a resource-handler 404 that quotes the path.
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saiman}
    username: ${SPRING_DATASOURCE_USERNAME:saiman}
    # No default: a missing app password must stop the service at startup (the file secret or SPRING_DATASOURCE_PASSWORD supplies it).
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      schema: ledger
  flyway:
    schemas: ledger
    default-schema: ledger
    create-schemas: true
    # V7 grants DML to the runtime role (ADR-0024); the ledger-migrate one-shot runs Flyway as ledger_owner (ADR-0027) and the pool uses ledger_app.
    placeholders:
      app_role: ledger_app
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger
      # A new ledger reads the whole history; the inbox makes redelivery harmless.
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
    producer:
      acks: all
      # Plain String JSON on the wire (ADR-0016). Spelled out because spring-modulith-events-kafka's JSON
      # auto-configuration (disabled below) would otherwise switch both sides to byte arrays.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  # Modulith's registry table is created by Flyway (V1__ledger.sql) in schema `ledger`; the registry
  # trigger annotation, republish-on-restart and completion mode come from libs/eventing (ADR-0016).
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      kafka:
        # Off: its byte-array converter and serializers; the ledger registers a String JSON converter instead
        # (LedgerMessagingConfiguration), which also keeps type headers off the wire.
        enable-json: false

saiman:
  # Read-only Base Sepolia client (libs/evm-rpc, ADR-0018): the public RPC, no key. Startup checks chain id 84532.
  chain:
    rpc-url: ${SAIMAN_CHAIN_RPC_URL:https://sepolia.base.org}
  ledger:
    reconciliation:
      interval: 5m
      grace-after-valid-before: 30m
      receipt-grace: 10m
      batch-size: 50
      min-manual-interval: 30s
    # Credit-note corroboration (ADR-0021): reconciliation asks seller-api's /internal/credit-notes/{key} whether a
    # CreditNoteIssued read from Kafka is real. Exact host; plain http only to the compose-internal seller.
    seller:
      base-url: ${SAIMAN_LEDGER_SELLER_BASE_URL:http://seller-api:8081}
      allowed-hosts: ${SAIMAN_LEDGER_SELLER_ALLOWED_HOSTS:seller-api}
      connect-timeout: 2s
      read-timeout: 5s
      retry-attempts: 3
      retry-wait: 200ms
      circuit-open-wait: 30s
      # The ledger's service token for seller-api's /internal/** (ADR-0023): configtree secret
      # seller_service_token_ledger mounted as saiman.ledger.seller.service-token. No default: startup fails without it.
    # Dashboard reads (BoundedReads): a transaction-local statement_timeout and a bulkhead, so polling can neither
    # hold a connection long nor take the pool (Hikari default 10) from the Kafka inbox/posting path. Both refusals
    # are a fixed 503 with Retry-After: 5.
    dashboard:
      read-timeout: 3s
      max-concurrent-reads: 4

server:
  port: 8082
  # Boot's /error fallback (errors outside Spring MVC's handlers): never echo the path, message, trace or bindings.
  error:
    include-path: never
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# The OpenAPI document is a build-time contract (docs/api/ledger.openapi.json, ADR-0022), not a runtime endpoint:
# OpenApiContractTests turns it on. No UI either (api-only starter).
springdoc:
  api-docs:
    enabled: false
  default-produces-media-type: application/json

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
    info:
      access: read-only
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
# Actuator: only health and info exist at all (access), not just over HTTP (exposure).
# Telemetry export is off unless the runtime turns it on, so tests and a plain `bootRun` never
# reach for a collector. Compose sets OTEL_EXPORTER_OTLP_ENDPOINT (Boot 4.1 maps it to the
# trace exporter) and MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true (ADR-0006).
