spring:
  application:
    name: seller-api
  threads:
    virtual:
      enabled: true
  config:
    # Docker/compose secrets (ADR-0009): one file per secret, e.g. /run/secrets/openai_api_key,
    # which the model router reads as the property openai_api_key.
    import: "optional:configtree:${saiman.secrets-dir:/run/secrets/}"
  mvc:
    problemdetails:
      enabled: true # RFC 9457 bodies for ResponseStatusException/ErrorResponseException/validation errors
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saiman}
    username: ${SPRING_DATASOURCE_USERNAME:saiman}
    password: ${SPRING_DATASOURCE_PASSWORD:saiman}
    hikari:
      schema: seller_api
      # A database outage must not hold a paid response for the default 30 s: recording the settlement
      # gives up quickly (the chain is the safety net, ADR-0016).
      connection-timeout: 2000 # ms
      validation-timeout: 1000 # ms: checking an idle pooled connection on a stalled database
      # The recorder also runs on the request thread: a stalled (not refused) database must not hold the paid
      # response either. socketTimeout (seconds) bounds any read from a dead connection; the 2 s transaction
      # timeout (SettlementOutboxConfiguration) makes the driver cancel the statement, and that cancel goes over
      # a new connection that a stalled server never answers, so cancelSignalTimeout (default 10 s!) is
      # shortened too. statement_timeout is the server-side cap.
      data-source-properties:
        socketTimeout: 2
        cancelSignalTimeout: 2
        options: "-c statement_timeout=2500"
  flyway:
    schemas: seller_api
    default-schema: seller_api
    create-schemas: true
  # Transactional outbox (ADR-0016): libs/eventing sets the registry defaults; V1 owns the table.
  modulith:
    events:
      jdbc:
        schema: seller_api
      kafka:
        # SettlementOutboxConfiguration writes the documented JSON as a String value without __TypeId__.
        enable-json: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Bounded: an unreachable broker fails a publication quickly; it stays incomplete in the registry and is
      # resubmitted later or on restart. A paid response never waits for Kafka.
      properties:
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    admin:
      operation-timeout: 10s

server:
  port: 8081

# x402 v2 server config (ADR-0008). No default for pay-to: fails startup closed if
# X402_SELLER_PAYTO_ADDRESS is not set (ADR-0009 -- seller-api never holds a private key, only this
# public payout address). x402.server.facilitator.url is left at its default
# (https://x402.org/facilitator); tests override it to a FakeFacilitator.
x402:
  server:
    pay-to: ${X402_SELLER_PAYTO_ADDRESS}
    # Settle margin = connect + read + 5 s; with the 25 s LLM deadline it must fit the 45 s window:
    # 25 + 3 + 12 + 5 = 45 (see seller.llm.deadline).
    facilitator:
      connect-timeout: 3s
      read-timeout: 12s

seller:
  disclosures:
    # fixture: the M1 in-memory demo data (default). rag: retrieval over the ingest service + the
    # model router (compose sets rag). Never a silent fallback from rag to fixture data.
    source: fixture
    summary-cache-ttl: 6h
  ingest:
    base-url: ${SELLER_INGEST_BASE_URL:http://ingest:8083}
    connect-timeout: 2s
    read-timeout: 5s # end-to-end request deadline (seller.llm.deadline): keep ingest calls short
    retry-attempts: 2 # total attempts, i.e. at most one retry
    retry-wait: 200ms
    circuit-open-wait: 30s
  # Model runs happen BEFORE x402 settlement, so their limits and time budget are explicit (F1, F2).
  llm:
    max-in-flight-per-payer: 2
    max-runs-per-payer-per-hour: 30
    max-unsettled-per-day: 100 # runs started whose payment has not settled, all payers, per UTC day
    # End-to-end budget per request, cut to (validBefore - now - facilitator connect - read timeout - 5 s)
    # when the authorization expires sooner. Startup fails unless deadline + connect (3 s) + read (12 s)
    # timeout + 5 s <= 45 s,
    # the authorization window the LLM endpoints demand.
    deadline: 25s
    single-flight-wait: 5s
    negative-cache-ttl: 120s
  http:
    max-body-bytes: 4096
    max-json-string-length: 65536
  prices:
    disclosure-summary: 10000 # 0.01 test USDC, 6 decimals (GET /v1/disclosures/{ticker}/summary)
    disclosure-answer: 20000 # 0.02 test USDC (POST /v1/disclosures/{ticker}/questions)

saiman:
  router:
    openai:
      # One attempt within 20 s: the request deadline is 25 s and a retried call would be billed twice.
      # A model call is not started with less than this left before the deadline (must be < deadline).
      timeout: 20s
      max-retries: 0

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
    info:
      access: read-only
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
# Actuator: only health and info exist at all (access), not just over HTTP (exposure).
# Telemetry export is off unless the runtime turns it on, so tests and a plain `bootRun` never
# reach for a collector. Compose sets OTEL_EXPORTER_OTLP_ENDPOINT (Boot 4.1 maps it to the
# trace exporter) and MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true (ADR-0006).
